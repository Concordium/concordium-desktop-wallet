name: Concordium Desktop Wallet release
on:
  push:
    tags:
      - 'desktop-wallet/*.*.*-stagenet'
      - 'desktop-wallet/*.*.*-testnet'
      - 'desktop-wallet/*.*.*-mainnet'

env:
  WASM-PACK_VERSION: "v0.13.1"
  NODE_VERSION: "18.20.7"
  RUST_VERSION: "1.74.1"

jobs:
  metadata:
    name: Check version and prepare metadata
    # runs-on: ubuntu-latest
    runs-on: ubuntu-22.04
    outputs:
      TARGET_NET: ${{ steps.target_net.outputs.TARGET_NET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Extract target network from tag
        id: target_net
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TARGET_NET=${TAG##desktop-wallet/*-}
          echo "TARGET_NET=$TARGET_NET" >> $GITHUB_OUTPUT

      - name: Verify tag version against project version
        id: version_check
        env:
          TAG: ${{ github.ref_name}}
        run: |
          # Extract version number
          VERSION=$(jq '.version' -r app/package.json)

          TAG_VERSION_NET=${TAG##*/}
          TAG_VERSION=${TAG_VERSION_NET%%-*}
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error:: Tag version is not correct. Tag version: $TAG_VERSION version from package.json: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build on ${{ matrix.platform.runner }}
    needs: metadata
    environment: code-sign-build
    strategy:
      matrix:
        # For each platform provide the runner image, the shell to use and some unique id.
        platform:
          - id: linux
            # runner: ubuntu-latest
            runner: ubuntu-22.04
            shell: bash
          - id: windows
            runner: windows-2022
            # Since electron-builder does not support pwsh, we use powershell instead.
            shell: powershell
          - id: macos-intel
            runner: macos-15-intel
            shell: bash
          - id: macos-arm64
            runner: macos-15
            shell: bash
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }} {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # Disable the default behavior of treating warnings as errors.
          # Should be removed again once the warnings are resolved.
          rustflags: ""

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: ${{ env.WASM-PACK_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: List dependency versions
        run: |
          echo "::notice::node version: $(node --version)"
          echo "::notice::npm version: $(npm --version)"
          echo "::notice::yarn version: $(yarn --version)"
          echo "::notice::python version: $(python --version)"
          echo "::notice::rustup version: $(rustup show)"
          echo "::notice::wasm-pack version: $(wasm-pack --version)"
          echo "::notice::OpenSSL version:" $(openssl version)

      - name: Install native packages and OpenSSL 1.1 (Ubuntu only)
        if: matrix.platform.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0 libudev-dev rpm wget patchelf build-essential

          # Build and install OpenSSL 1.1.1w from source
          OPENSSL_VERSION=1.1.1w
          cd /tmp
          wget https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-$OPENSSL_VERSION.tar.gz
          tar -xzf openssl-$OPENSSL_VERSION.tar.gz
          cd openssl-$OPENSSL_VERSION
          ./config --prefix=/opt/openssl-1.1 --openssldir=/opt/openssl-1.1 shared
          make -j$(nproc)
          sudo make install_sw

          # Configure runtime and build paths
          echo "/opt/openssl-1.1/lib" | sudo tee /etc/ld.so.conf.d/openssl-1.1.conf
          sudo ldconfig

          echo "OPENSSL_DIR=/opt/openssl-1.1" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/openssl-1.1/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/openssl-1.1/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install Node packages
        env:
          # Prevent corepack from prompting for permission to download.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          yarn

      - name: Install DigiCert Client tools (Windows only)
        if: matrix.platform.id == 'windows'
        id: digicert_client
        uses: digicert/ssm-code-signing@v1.0.1

      - name: Import Windows certificate (Windows only)
        id: windows_certificate
        if: matrix.platform.id == 'windows'
        env:
          # Base64 encoding of the pfx/p12 certificate for Windows code signing.
          BUILD_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_BUILD_CERTIFICATE_BASE64 }}
        run: |
          $CERTIFICATE_PATH_BASE64="$env:RUNNER_TEMP\windows_build_certificate.txt"
          $CERTIFICATE_PATH="$env:RUNNER_TEMP\windows_build_certificate.pfx"

          Set-Content -Path $CERTIFICATE_PATH_BASE64 -Value $env:BUILD_CERTIFICATE_BASE64
          certutil -decode $CERTIFICATE_PATH_BASE64 $CERTIFICATE_PATH

          # fail fast instead of silently proceeding with a missing/empty
          # certificate file if the decode above didn't actually work
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $CERTIFICATE_PATH) -or (Get-Item $CERTIFICATE_PATH).Length -eq 0) {
            Write-Error "Failed to decode WINDOWS_BUILD_CERTIFICATE_BASE64 into a certificate file."
            exit 1
          }

          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> $env:GITHUB_OUTPUT

      - name: Verify Windows signing credentials (Windows only)
        if: matrix.platform.id == 'windows'
        env:
          SM_HOST: ${{ secrets.WINDOWS_SM_HOST }}
          SM_API_KEY: ${{ secrets.WINDOWS_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ steps.windows_certificate.outputs.CERTIFICATE_PATH }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.WINDOWS_BUILD_CERTIFICATE_PASSWORD }}
          WINDOWS_SM_KEYPAIR_ALIAS: ${{ secrets.WINDOWS_SM_KEYPAIR_ALIAS }}
        run: |
          # verify DigiCert KeyLocker credentials/connectivity before running
          # the full build, instead of only finding out when smctl sign fails
          # deep into `yarn package`
          smctl healthcheck --user
          if ($LASTEXITCODE -ne 0) {
            Write-Error "smctl healthcheck failed. Check the WINDOWS_SM_HOST / WINDOWS_SM_API_KEY / WINDOWS_BUILD_CERTIFICATE_BASE64 / WINDOWS_BUILD_CERTIFICATE_PASSWORD secrets."
            exit 1
          }

          # verify the configured keypair alias actually exists in KeyLocker
          $keypair = smctl keypair ls --filter "alias=$env:WINDOWS_SM_KEYPAIR_ALIAS"
          Write-Output $keypair
          if ($LASTEXITCODE -ne 0 -or -not ($keypair -match [Regex]::Escape($env:WINDOWS_SM_KEYPAIR_ALIAS))) {
            Write-Error "Keypair alias '$env:WINDOWS_SM_KEYPAIR_ALIAS' (WINDOWS_SM_KEYPAIR_ALIAS) was not found in DigiCert KeyLocker."
            exit 1
          }

      - name: Import Apple certificate (MacOS only)
        if: matrix.platform.id == 'macos-intel' || matrix.platform.id == 'macos-arm64'
        env:
          # Base64 encoding of the p12 certificate for Apple code signing.
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          # Password for the p12 certificate for Apple code signing.
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          # Random string to use as the keychain password.
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/apple_build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # fail fast with a clear error instead of silently proceeding to build
          # an unsigned/partially-signed app if the import above didn't actually
          # produce a usable signing identity
          if ! security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -q "1)"; then
            echo "::error::No valid code signing identity found in keychain after import. Check the APPLE_BUILD_CERTIFICATE_BASE64 / APPLE_BUILD_CERTIFICATE_PASSWORD secrets."
            security find-identity -v -p codesigning $KEYCHAIN_PATH
            exit 1
          fi

      - name: Disable Spotlight indexing (MacOS only)
        if: matrix.platform.id == 'macos-intel' || matrix.platform.id == 'macos-arm64'
        # electron-builder's DMG step attaches the built DMG as a volume, copies
        # files onto it, then detaches it. Spotlight (mdworker) indexing that
        # freshly-mounted volume can hold it open just long enough to make
        # `hdiutil detach` fail with "Resource busy", which electron-builder only
        # retries once. Disabling indexing avoids that race.
        run: sudo mdutil -a -i off

      - name: Build
        env:
          # Set the target Concordium network for the build.
          TARGET_NET: ${{ needs.metadata.outputs.TARGET_NET }}
          # Apple code sign variables:
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          APPLEID: ${{ secrets.APPLEID }}
          TEAMID: ${{ secrets.TEAMID }}
          # Windows code sign variables:
          WINDOWS_PKCS11_CONFIG: ${{ steps.digicert_client.outputs.PKCS11_CONFIG }}
          WINDOWS_SM_KEYPAIR_ALIAS: ${{ secrets.WINDOWS_SM_KEYPAIR_ALIAS }}
          SM_HOST: ${{ secrets.WINDOWS_SM_HOST }}
          SM_API_KEY: ${{ secrets.WINDOWS_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ steps.windows_certificate.outputs.CERTIFICATE_PATH }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.WINDOWS_BUILD_CERTIFICATE_PASSWORD }}

          # New environment variables for static OpenSSL
          OPENSSL_STATIC: "1"
          OPENSSL_DIR: "/opt/openssl-1.1"
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: yarn package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.id }}
          if-no-files-found: error
          path: |
            release/concordium-desktop-wallet-*
            release/latest*.yml
            release/testnet*.yml
            release/stagenet*.yml

  release:
    name: Attach to Github release (Auto update prompts will appear for supported platforms).
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0 libudev-dev rpm

      - name: Install Node packages
        env:
          # Prevent corepack from prompting for permission to download.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          yarn

      - uses: actions/download-artifact@v4

      - name: Merge macOS auto-update manifests (x64 + arm64 builds)
        # The macos-intel and macos-arm64 jobs each produce a same-named
        # <channel>-mac.yml with only their own architecture's entry; merge
        # them into one manifest (in uploads/) so electron-updater can pick
        # the right build for whichever architecture is running.
        run: node scripts/merge-mac-update-manifests.js uploads macos-intel macos-arm64

      - run: |
          mkdir -p uploads
          mv linux/* uploads/
          mv windows/* uploads/
          mv macos-intel/* uploads/
          mv macos-arm64/* uploads/

      - name: Retrieve sign key and generate verification assets
        env:
          FILE_DIGEST_SIGN_KEY_BASE64: ${{ secrets.FILE_DIGEST_SIGN_KEY_BASE64 }}
          TARGET_NET: ${{ needs.metadata.outputs.TARGET_NET }}
        run: |
          SIGN_KEY_PATH=$RUNNER_TEMP/private-sign-key.pem
          echo $FILE_DIGEST_SIGN_KEY_BASE64 | base64 --decode > $SIGN_KEY_PATH
          yarn generate-verification-assets --pkey $SIGN_KEY_PATH --dir ./uploads

      - name: Attach binaries to an existing release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} uploads/*
